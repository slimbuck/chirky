# Game loaded automatically whenever the Pi boots or the host restarts.
# Use "launcher" to boot to the game-selection menu instead.
boot_game=launcher

# Default GP2040 Generic SNES-style bindings (Linux evdev codes).
# All inputs map to SNES buttons. Games decide what each button does.
bind_left=abs:16:-1
bind_right=abs:16:1
bind_up=abs:17:-1
bind_down=abs:17:1
bind_y=key:304
bind_b=key:305
bind_a=key:307
bind_x=key:306
bind_l=key:308
bind_r=key:309
bind_start=key:313
bind_select=key:312

# Input settings wizard and CRT-safe viewport.
input_version=3
safe_x=16
safe_y=12
safe_offset_x=0
safe_offset_y=0
key_left=key:105
key_right=key:106
key_up=key:103
key_down=key:108
key_y=key:44
key_b=key:45
key_a=key:46
key_x=key:31
key_l=key:30
key_r=key:32
key_start=key:28
key_select=key:1
