<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chirky Box</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><h1>Chirky Box</h1><span id="status" role="status">Loading…</span></header>
  <section id="player" aria-label="Chirky player">
    <div id="display"><canvas id="screen" width="320" height="240" tabindex="0" aria-label="Chirky Box game screen"></canvas></div>
    <nav aria-label="Player controls"><a href="./">Launcher</a><button id="pause">Pause</button><button id="restart">Restart</button><button id="input-settings">Input settings</button><button id="mute" aria-pressed="false">Mute</button><button id="fullscreen" aria-pressed="false">Full screen</button></nav>
    <p class="help" id="control-help"></p>
    <div class="touch" aria-label="Touch controller"><div class="dpad"><button data-button="2" aria-label="Up">↑</button><button data-button="0" aria-label="Left">←</button><button data-button="3" aria-label="Down">↓</button><button data-button="1" aria-label="Right">→</button></div><div class="actions"><button data-button="4">Primary</button><button data-button="5">Secondary</button><button data-button="6">Start</button><button data-button="7">Menu</button></div></div>
    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">Input settings</h2><p>Choose an input, then press its new key. Each key can map to one input.</p>
      <div class="bindings"><button data-bind="0">Left</button><button data-bind="1">Right</button><button data-bind="2">Up</button><button data-bind="3">Down</button><button data-bind="4">Primary</button><button data-bind="5">Secondary</button><button data-bind="6">Start</button><button data-bind="7">Menu</button></div>
      <p id="binding-message" role="status"></p><button id="cancel-binding" hidden>Cancel key capture</button>
      <label>Touch controls <select id="touch-mode"><option value="auto">Auto</option><option value="show">Show</option><option value="hide">Hide</option></select></label>
      <p class="help">Standard gamepad: D-pad or left stick, south button for Primary, west button for Secondary, Start and Select for Start and Menu.</p>
      <div class="settings-actions"><button id="reset-bindings">Reset defaults</button><button id="cancel-settings">Cancel</button><button id="save-settings">Save</button></div>
    </dialog>
  </section>
</main><script type="module" src="player.js"></script></body></html>
