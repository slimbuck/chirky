<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chirky Box</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><h1>Chirky Box</h1><span id="status" role="status">Loading…</span></header>
  <div id="display"><canvas id="screen" width="320" height="240" tabindex="0" aria-label="Chirky Box game screen"></canvas></div>
  <nav aria-label="Player controls"><a href="./">Launcher</a><button id="pause">Pause</button><button id="restart">Restart</button><button id="mute" aria-pressed="false">Mute</button><button id="fullscreen">Full screen</button></nav>
  <p class="help">Arrow keys: move · Z: Y · X / Enter: B · C: A · V: X<br>A / S: shoulders · Space: Start · Esc: Select<br>Standard gamepads supported. Click the screen to play.</p>
  <div class="touch" aria-label="Touch controller"><div><button data-button="2">↑</button><br><button data-button="0">←</button><button data-button="3">↓</button><button data-button="1">→</button></div><div><button data-button="4">Y</button><button data-button="7">X</button><br><button data-button="5">B</button><button data-button="6">A</button></div><div><button data-button="10">Start</button><button data-button="11">Select</button></div></div>
</main><script type="module" src="player.js"></script></body></html>
